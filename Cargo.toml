[package]
name = "rx4"
version = "0.8.0"
edition = "2021"
rust-version = "1.89"
license = "MPL-2.0"
description = "The agent harness engine — loop, tools, providers, sessions, permissions, computer-use"
repository = "https://github.com/tschk/rotary"
homepage = "https://github.com/tschk/rotary"
keywords = ["agent", "harness", "llm", "mcp", "coding"]
categories = ["development-tools", "api-bindings", "asynchronous", "command-line-utilities"]

[[bin]]
name = "rx4"
path = "src/bin/rotary.rs"
required-features = ["cli"]

[[bin]]
name = "rx4-script-worker"
path = "src/bin/script-worker.rs"
required-features = ["script"]

[lib]
name = "rx4"
path = "src/lib.rs"

[features]
default = ["native", "builtin-tools"]
# Host-driven agent state machine: no native runtime, filesystem, network or RNG.
lite = []
native = ["dep:tracing", "dep:dashmap", "dep:moka", "dep:uuid", "dep:chrono", "dep:cancellation-token", "dep:sha2", "dep:tempfile", "tokio/rt", "tokio/time", "tokio/macros", "tokio/fs", "tokio/io-util"]
# Product CLI (`rx4` binary). Slim library hosts should leave this off.
cli = ["native", "dep:clap"]
computer-use = ["native", "dep:ed25519-dalek", "dep:hex", "dep:rand_core", "dep:praefectus"]
# Native loop uses JoinSet/timers; IPC adds net/process extras.
ipc = ["native", "tokio/net", "tokio/io-util", "tokio/sync", "tokio/process", "tokio/rt-multi-thread", "dep:subtle"]
providers = ["native", "dep:reqwest", "reqwest/json", "reqwest/rustls-tls", "dep:eventsource-stream", "dep:futures"]
builtin-tools = ["native", "dep:regex", "tokio/process"]
memory = ["native", "dep:rusqlite"]
mcp = ["native", "tokio/process", "tokio/io-util", "tokio/sync", "dep:reqwest", "reqwest/json", "reqwest/rustls-tls", "dep:futures"]
sqlite-sessions = ["native", "dep:rusqlite"]
graph-memory = ["native"]
zkr-memory = ["native", "dep:zkr"]
personality = ["zkr-memory"]
skills = ["native", "dep:serde_yaml", "dep:dirs"]
# Indexed grep/find via fff-search (git2/notify). Slim hosts use stdlib walk.
fff = ["native", "dep:fff-search"]
# Sandboxed Lua `script` tool (read-only bridges; vendored LuaJIT, Lua 5.1).
script = ["native", "dep:mlua", "dep:regex", "dep:rustix", "tokio/process", "tokio/io-util"]
# Host-API islands — off unless a host names them.
autoresearch = ["native", "tokio/process"]
marketplace = ["mcp"]
routing = ["native"]
extract = ["native"]
work-pack = ["native"]
sse = ["native"]
multiagent = ["native"]

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
async-trait = "0.1"
thiserror = "2"
tracing = { version = "0.1", optional = true }
parking_lot = "0.12"
dashmap = { version = "6", optional = true }
moka = { version = "0.12", features = ["future"], optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
# Portable permission channels need sync only; native enables runtime and I/O.
tokio = { version = "1", default-features = false, features = ["sync"] }

# Native cancellation used by embedded and IPC hosts.
cancellation-token = { version = "0.1", optional = true }

# Optional — providers
reqwest = { version = "0.12", features = ["json", "stream", "blocking"], default-features = false, optional = true }
eventsource-stream = { version = "0.2", optional = true }
futures = { version = "0.3", optional = true }
regex = { version = "1", optional = true }
fff-search = { version = "0.10.2-nightly.686a849", optional = true }

# Optional — sandboxed LuaJIT for the `script` tool
mlua = { version = "0.10", default-features = false, features = ["luajit", "vendored"], optional = true }

# Optional — computer-use
ed25519-dalek = { version = "2.1", default-features = false, features = ["rand_core", "std"], optional = true }
hex = { version = "0.4", optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
praefectus = { version = "0.8.0", optional = true }

# Optional — memory / sqlite-sessions
rusqlite = { version = "0.41", features = ["bundled"], optional = true }
zkr = { version = "0.5.1", optional = true }

# Skill frontmatter parsing (skill_engine) and home-dir resolution.
serde_yaml = { version = "0.9", optional = true }
dirs = { version = "6", optional = true }

# Native agent cache / tool-loadout fingerprints.
sha2 = { version = "0.10", optional = true }
tempfile = { version = "3", optional = true }
# IPC token compare. Marketplace does not use this crate.
subtle = { version = "2.6.1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.6", features = ["process"], optional = true }

[[example]]
name = "provider_agent"
required-features = ["providers"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tokio-test = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "core"
harness = false
required-features = ["sse"]

[[test]]
name = "autoresearch_controller"
required-features = ["autoresearch"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[[bench]]
name = "repomap_bench"
harness = false
